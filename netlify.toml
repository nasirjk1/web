[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["storage/downloads/courses/**"]

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/api/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/api/robots.txt"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/downloads/courses/*"
  to = "/.netlify/functions/api/downloads/courses/:splat"
  status = 200

[[redirects]]
  from = "/guides"
  to = "/articles"
  status = 301

[[redirects]]
  from = "/guides/*"
  to = "/articles/:splat"
  status = 301

[[redirects]]
  from = "/tracks"
  to = "/learning-pathways"
  status = 301

[[redirects]]
  from = "/student"
  to = "/student/dashboard"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
