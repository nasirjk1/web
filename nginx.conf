# ========================================================
# WEB NASIR — NGINX REVERSE PROXY CONFIGURATION
# Place in /etc/nginx/sites-available/webnasir.conf on Hostinger VPS / Ubuntu
# ========================================================

server {
    listen 80;
    listen [::]:80;
    server_name webnasir.dpdns.org www.webnasir.dpdns.org;

    # Increase max upload size for Admin Media Library uploads
    client_max_body_size 25M;

    # Gzip compression for fast mobile & desktop loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;

    # Proxy all traffic to the Web Nasir Node.js server (Port 3000)
    # The Node.js server handles:
    # - /api/* REST endpoints
    # - /sitemap.xml & /robots.txt
    # - 301 canonical redirects (/guides -> /articles, /tracks -> /learning-pathways)
    # - Dynamic Server-Side SEO meta tags & JSON-LD injection for every route
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
